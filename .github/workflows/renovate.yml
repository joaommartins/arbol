on:
  workflow_dispatch:
  schedule:
    # Runs every day at 8:00 AM Sydney time (9:00 PM UTC previous day)
    - cron: "0 21 * * *"

name: Renovate

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@1c0cf989c02653fba0efe7ca5772338860ca71dc # v46.3.12
        env:
          LOG_LEVEL: debug
        with:
          configurationFile: renovate-self-hosted.js
          token: ${{ secrets.RENOVATE_TOKEN }}
