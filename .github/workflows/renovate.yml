on:
  workflow_dispatch:
  schedule:
    # Runs every day at 8:00 AM Sydney time (9:00 PM UTC previous day)
    - cron: "0 21 * * *"

name: Renovate

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@1376d90bcd3a4d4e7393ae762eea56ac684aee38 # v48.0.0
        env:
          LOG_LEVEL: debug
        with:
          configurationFile: renovate-self-hosted.js
          token: ${{ secrets.RENOVATE_TOKEN }}
